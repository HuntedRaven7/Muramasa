# Single source of truth for third-party pins.
#
# Everything that is downloaded is pinned here; elements reference these via
# %{variable}. `just track` (and .github/workflows/auto-pins.yml) updates the
# mutable values and opens a PR. A build with an unset pin fails
# `tests/test_pins.py` before any source is fetched.
variables:
  # --- Toolchain ------------------------------------------------------------
  fsdk-ref: "freedesktop-sdk-26.08.4-0-g114ae909ec9881958bd507c8b4414aa33f758d2b"
  bst-sbom-ref: "0706fec3bedf6f73bd9d2fed32c2aed585feef8d"
  buildstream-plugins-ref: "2.5.0-0-g79649529cffb695d0d22195ed9a4910c80ca6907"
  buildstream-plugins-community-ref: "85c2bae9d3a1eb3121c9674f68ef6e87211fddb9c930f3e5057b9a1e66eb41d9"

  # --- Compositor and shell -------------------------------------------------
  # Mango: pinned to the reviewed main-branch commit (2026-11-21).
  mango-ref: "578a2efccea00d6909d5751d0d4058e86fc11598"
  # Quickshell v0.3.2: annotated tag object -> dereferenced commit.
  quickshell-version: "v0.3.2"
  quickshell-tag-ref: "8e2bb761d3e994fc04359c55dec269b747654b6a"
  quickshell-ref: "4f508be500dea6e5732cc3d50382a0048b17e7b1"

  # --- Desktop tooling ------------------------------------------------------
