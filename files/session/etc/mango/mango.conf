# Muramasa default Mango configuration.
# This is the only compositor config shipped by the image. Copy it to
# ~/.config/mango/mango.conf to customize. It intentionally contains no shell
# or wallpaper integration: those are added by the image owner separately.

# Tags
tag_num=9
tag_gather=1

# Layout
layout=0

# Gaps and borders
gaps_in=8
gaps_out=8
border_width=2

# Appearance
active_border_color=0x7aa2f7ff
inactive_border_color=0x3b4261ff

# Input
cursor_shape=left_ptr
focus_on_activate=1

# Default applications
bind=SUPER,Return,spawn,kitty
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,q,killclient,
bind=SUPER,Tab,overcircle,next
bind=ALT,Tab,overcircle,prev
bind=SUPER,f,togglefullscreen,
bind=SUPER,space,togglefloating,

# Audio and media
bind=SUPER,comma,spawn,playerctl previous
bind=SUPER,period,spawn,playerctl next
bind=SUPER,slash,spawn,playerctl play-pause

# Screenshots
bind=SUPER,s,spawn,grim -g "$(slurp)" -
bind=SUPER+SHIFT,s,spawn,grim -

# Voice input (voxtype push-to-talk)
bind=SUPER,v,spawn,voxtype record toggle
