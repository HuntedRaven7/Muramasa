name: muramasa

min-version: 2.5

element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml
  - include/versions.yml
  - include/flavors.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64
  # x86-64-v3 is the default for x86_64. aarch64 builds are unaffected.
  # Disable explicitly with `-o x86_64_v3 false` for a baseline build.
  x86_64_v3:
    type: bool
    description: Enable x86-64-v3 on x86_64
    default: true
  # The NVIDIA flavor adds the proprietary driver stack on top of the same
  # OGC kernel. Both flavors ship from one source tree.
  nvidia:
    type: bool
    description: Build the NVIDIA flavor
    variable: nvidia
    default: false
  # Sign the UKI and kernel modules with the Muramasa Secure Boot key.
  # CI enables this when SECURE_BOOT_KEY / SECURE_BOOT_CERT secrets are set.
  secure_boot_signing:
    type: bool
    description: Sign boot artifacts with the Secure Boot key
    variable: secure_boot_signing
    default: false

sandbox:
  build-arch: "%{arch}"

variables:
  branch: testing
  image-name: muramasa
  image-registry: ghcr.io/huntedraven7
  image-description: 'FSDK-based Wayland-compositor desktop built around Mango'
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        efi-arch: "x64"
    - arch == "aarch64":
        go-arch: "arm64"
        efi-arch: "aa64"

# Pull-only upstream caches. These are the same artifact caches Dakota and
# Mjolnir use: the GNOME (gbm) cache and the Bluefin cache are both built on
# freedesktop-sdk, so their FSDK artifacts are reusable even though Muramasa
# does not ship GNOME Shell. Our own cache lives in GHCR (see docs/CACHE.md).
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - cmake
      - make
      - meson
    sources:
      - patch
      - docker
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - flatpak_image
      - flatpak_repo
      - ostree
      - pyproject
    sources:
      - anitya
      - gen_cargo_lock
      - cargo2
      - git_module
      - git_repo
      - go_module
      - patch_queue
      - zip
  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
