name: auto-pins

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing
      - name: Recompute pinned refs
        run: python3 scripts/update-pins.py
      - name: Open PR if pins changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: testing
          branch: chore/auto-pins
          commit-message: 'chore: update pinned source refs'
          title: 'chore: update pinned source refs'
          body: |
            Automated refresh of `include/versions.yml` from upstream remotes.
            Reviews should check the upstream changelogs before merging; a pin
            bump changes BuildStream artifact keys and rebuilds affected layers.
