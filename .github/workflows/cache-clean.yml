name: cache-clean

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: projectbluefin/actions/bootc-build/ghcr-cleanup@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
        with:
          packages: muramasa-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
